openapi: 3.1.0
info:
  title: Api
  version: 0.3.0
  description: Korean Travel Guide API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: moods
  - name: recommendations
  - name: images
  - name: places
  - name: kto
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /moods:
    get:
      operationId: getMoods
      tags: [moods]
      summary: Get the 7 GOAT primary mood themes
      responses:
        "200":
          description: Mood inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoodsSuccessResponse"
  /geocode-origin:
    post:
      operationId: geocodeOrigin
      tags: [recommendations]
      summary: Resolve a region, address, station, or place name to an origin coordinate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeocodeOriginRequest"
      responses:
        "200":
          description: Resolved origin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeocodeOriginSuccessResponse"
        "400":
          description: Invalid search query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Origin not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Kakao Local API is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /recommend-from-tags:
    post:
      operationId: recommendFromTags
      tags: [recommendations]
      summary: Recommend three places using the GOAT v1.3+ scoring engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecommendFromTagsRequest"
      responses:
        "200":
          description: Recommendations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationsSuccessResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many recommendation requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Debug responses are disabled by the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /recommend-course:
    post:
      operationId: recommendCourse
      tags: [recommendations]
      summary: Build a day course from one selected GOAT recommendation card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecommendCourseRequest"
      responses:
        "200":
          description: Day course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendCourseSuccessResponse"
        "400":
          description: Invalid request or selected place not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many recommendation requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Debug responses are disabled by the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /analyze-image:
    post:
      operationId: analyzeImage
      tags: [images]
      summary: Analyze an uploaded travel photo and map it to GOAT mood tags
      description: >
        Accepts one image from an authenticated client. The server should derive
        the user id from the JWT/session if persisted data is needed; clients
        must not submit user_id in the request body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeImageRequest"
      responses:
        "200":
          description: Image mood analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeImageSuccessResponse"
        "400":
          description: Invalid image payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required when saving analysis history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Image payload too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /places/{id}:
    get:
      operationId: getPlace
      tags: [places]
      summary: Get a place by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Place details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceSuccessResponse"
        "404":
          description: Place not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /kto:
    get:
      operationId: proxyKto
      tags: [kto]
      summary: Proxy a Korea Tourism Organization API request
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: KTO path below https://apis.data.go.kr/B551011/
        - name: MobileOS
          in: query
          schema: { type: string, default: ETC }
        - name: MobileApp
          in: query
          schema: { type: string, default: GOAT }
        - name: _type
          in: query
          schema: { type: string, enum: [json] }
        - name: keyword
          in: query
          schema: { type: string }
        - name: contentId
          in: query
          schema: { type: string }
        - name: contentTypeId
          in: query
          schema: { type: string }
        - name: areaCode
          in: query
          schema: { type: string }
        - name: numOfRows
          in: query
          schema: { type: integer, minimum: 1 }
        - name: pageNo
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Raw KTO JSON response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Missing path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KtoProxyError"
        "403":
          description: KTO path is outside the server allowlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KtoProxyError"
        "500":
          description: Missing service key or upstream failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KtoProxyError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    ApiSuccessBase:
      type: object
      properties:
        success:
          type: boolean
          const: true
        code:
          type: string
          const: SUCCESS
        message:
          type: string
      required: [success, code, message]
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          const: false
        code:
          type: string
        message:
          type: string
        data:
          nullable: true
      required: [success, code, message, data]
    KtoProxyError:
      type: object
      properties:
        error:
          type: string
      required: [error]
    Mood:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        keywords:
          type: array
          items:
            type: string
        referenceCards:
          type: array
          items:
            $ref: "#/components/schemas/ReferenceCard"
      required: [id, name, description, keywords]
    ReferenceCard:
      type: object
      properties:
        referenceCardId:
          type: string
        displayOrder:
          type: integer
        title:
          type: string
        subtitle:
          type: string
        primaryTheme:
          type: string
        sceneTags:
          type: array
          items:
            type: string
        moodTags:
          type: array
          items:
            type: string
        recommendedPurpose:
          type: array
          items:
            type: string
        recommendedBestTime:
          type: array
          items:
            type: string
        recommendedTransport:
          type: array
          items:
            type: string
        examplePlaceIds:
          type: array
          items:
            type: string
        uiKeywords:
          type: array
          items:
            type: string
        candidateCount:
          type: integer
        coverageCount:
          type: integer
      required: [referenceCardId, title, primaryTheme, sceneTags, moodTags, uiKeywords]
    MoodsData:
      type: object
      properties:
        moods:
          type: array
          items:
            $ref: "#/components/schemas/Mood"
        referenceCards:
          type: array
          items:
            $ref: "#/components/schemas/ReferenceCard"
      required: [moods, referenceCards]
    MoodsSuccessResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/MoodsData"
          required: [data]
    TravelPreferences:
      type: object
      properties:
        companion:
          type: string
          enum: [혼자, 연인, 친구, 가족]
        transport:
          type: string
          enum: [자차, 대중교통, 도보중심]
        visitTime:
          type: [string, "null"]
          enum: [새벽, 오전, 한낮, 오후, 일몰, 저녁, 야간, 밤/새벽, null]
        purpose:
          type: string
          enum: [가볍게 산책, 사진 위주, 액티비티, 조용한 휴식]
      required: [companion, transport, purpose]
      additionalProperties: false
    TravelOrigin:
      type: object
      properties:
        type:
          type: string
          enum: [current, region, address, skip]
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        regionName:
          type: string
          minLength: 1
      required: [type]
      additionalProperties: false
    GeocodeOriginRequest:
      type: object
      properties:
        query:
          type: string
          minLength: 2
          maxLength: 120
      required: [query]
      additionalProperties: false
    GeocodeOriginData:
      type: object
      properties:
        origin:
          $ref: "#/components/schemas/TravelOrigin"
        address:
          type: string
        source:
          type: string
          enum: [ADDRESS, KEYWORD]
      required: [origin, address, source]
    GeocodeOriginSuccessResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/GeocodeOriginData"
          required: [data]
    RecommendFromTagsRequest:
      type: object
      properties:
        moodId:
          type: string
          minLength: 1
        referenceCardId:
          type: string
          minLength: 1
        travelPurpose:
          type: string
          enum: [사진·포토스팟, 산책·힐링, 카페·실내휴식, 전시·건축관람, 체험·액티비티, 먹거리·야간탐방, 숙소·리조트]
        transportType:
          type: string
          enum: [자차, 대중교통, 도보중심]
        visitTime:
          type: string
          enum: [새벽, 오전, 한낮, 오후, 저녁, 야간]
        currentMonth:
          type: integer
          minimum: 1
          maximum: 12
        sessionId:
          type: string
          minLength: 8
          maxLength: 128
          pattern: '^[A-Za-z0-9._:-]+$'
          description: Client-persisted anonymous session identifier used to scope recent exposure history.
        rerollOfRequestId:
          type: string
          minLength: 8
          maxLength: 128
          pattern: '^[A-Za-z0-9._:-]+$'
          description: Previous data.requestId. Requires sessionId and excludes that request's three cards within the same session.
        debug:
          type: boolean
        preferences:
          $ref: "#/components/schemas/TravelPreferences"
        origin:
          $ref: "#/components/schemas/TravelOrigin"
        excludeIds:
          type: array
          uniqueItems: true
          maxItems: 61
          items:
            type: string
            minLength: 1
      additionalProperties: false
    RecommendCourseRequest:
      type: object
      properties:
        selectedPlaceId:
          type: string
          minLength: 1
        primaryTheme:
          type: string
          enum: [바다·해안 무드, 일본 소도시·골목 무드, 알프스·고원·목장 무드, 숲·정원·자연휴식 무드, 레트로·시장·항구 무드, 건축·전시·랜드마크 무드, 휴양·카페·이국공간 무드]
        userMoodTags:
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 1
        userSceneTags:
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 1
        companionType:
          type: string
          enum: [혼자, 친구, 연인, 가족]
        travelPurpose:
          type: string
          enum: [사진·포토스팟, 산책·힐링, 카페·실내휴식, 전시·건축관람, 체험·액티비티, 먹거리·야간탐방, 숙소·리조트]
        transportType:
          type: string
          enum: [자차, 대중교통, 도보중심]
        radiusMeters:
          type: integer
          minimum: 100
          maximum: 20000
        maxCandidatesForLlm:
          type: integer
          minimum: 1
          maximum: 20
        forceRuleBasedFallback:
          type: boolean
        llmModel:
          type: string
          minLength: 1
          maxLength: 120
          description: Optional model from the server-side OPENROUTER_ALLOWED_MODELS allowlist.
        debug:
          type: boolean
          description: Available only when ALLOW_RECOMMENDATION_DEBUG=true on the server.
      required: [selectedPlaceId, primaryTheme]
      additionalProperties: false
    Place:
      type: object
      properties:
        place_id: { type: string }
        city: { type: string }
        region_group: { type: string }
        place_name: { type: string }
        place_type: { type: string }
        primary_mood: { type: string }
        mood_tags:
          type: array
          items: { type: string }
        photo_point: { type: string }
        best_time: { type: string }
        best_season: { type: string }
        accessibility: { type: string }
        data_status:
          type: string
          enum: [confirmed, needs_verification, future_candidate]
        recommendation_use: { type: string }
        note: { type: string }
        address: { type: string }
        lat: { type: number }
        lng: { type: number }
        imageUrl: { type: string }
        parking: { type: string }
        travelTime: { type: string }
        weatherFit: { type: string }
        crowdLevel: { type: string }
        contactInfo: { type: string }
        description: { type: string }
      required:
        - place_id
        - city
        - region_group
        - place_name
        - place_type
        - primary_mood
        - mood_tags
        - photo_point
        - best_time
        - best_season
        - accessibility
        - data_status
        - recommendation_use
        - note
    RecommendationRouteInfo:
      type: object
      properties:
        from:
          type: string
          enum: [ORIGIN, FIRST_CARD]
        fromLabel:
          type: string
        distanceKm:
          type: number
          minimum: 0
        durationMin:
          type: integer
          minimum: 1
        source:
          type: string
          enum: [KAKAO_ROUTE, HAVERSINE]
        estimated:
          type: boolean
        scoreApplied:
          type: boolean
      required: [from, fromLabel, distanceKm, source, estimated, scoreApplied]
    Recommendation:
      type: object
      properties:
        place:
          $ref: "#/components/schemas/Place"
        role:
          type: string
          enum: [장면 최적, 같은 분위기 대안, 조건 맞춤]
        score:
          type: number
        reason:
          type: string
        matchedTags:
          type: array
          items:
            type: string
        scoreBreakdown:
          type: object
          additionalProperties:
            type: number
        safetyNotes:
          type: array
          items:
            type: string
        weatherFit:
          type: string
        parkingInfo:
          type: string
        routeInfo:
          $ref: "#/components/schemas/RecommendationRouteInfo"
      required:
        [place, role, score, reason, matchedTags, scoreBreakdown, safetyNotes, weatherFit, parkingInfo]
    RecommendationsData:
      type: object
      properties:
        requestId:
          type: string
          description: Server-generated request identifier to send as rerollOfRequestId on the next reroll.
        moodId:
          type: string
        referenceCardId:
          type: string
        appliedTags:
          type: array
          items:
            type: string
        seedPoolSize:
          type: integer
          const: 61
        candidatePoolSize:
          type: integer
          minimum: 0
          maximum: 61
        poolPolicy:
          type: string
          enum: [ALL61, PRIMARY43]
        poolReason:
          type: string
        fallbackUsed:
          type: boolean
        adaptivePoolRetryUsed:
          type: boolean
        recommendations:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/Recommendation"
        cards:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: object
            additionalProperties: true
        alternatives:
          type: array
          items:
            type: object
            additionalProperties: true
        warnings:
          type: array
          items:
            type: string
        originStatus:
          type: string
          enum: [APPLIED, SKIPPED, UNAVAILABLE]
        originNotice:
          type: string
      required:
        [requestId, moodId, appliedTags, seedPoolSize, candidatePoolSize, poolPolicy, poolReason, fallbackUsed, adaptivePoolRetryUsed, recommendations]
    RecommendationsSuccessResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/RecommendationsData"
          required: [data]
    CourseStop:
      type: object
      properties:
        order: { type: integer }
        id: { type: string }
        title: { type: string }
        type:
          type: string
          enum: [START_PLACE, TOUR, CAFE, RESTAURANT, WALK, PHOTO, ETC]
        category:
          type: string
          enum: [START_PLACE, TOUR, CAFE, RESTAURANT, MARKET, WALK, PHOTO, ETC]
        address: { type: string }
        lat: { type: number }
        lng: { type: number }
        stayMinutes: { type: integer }
        reason: { type: string }
        source: { type: string }
      required: [order, id, title, type, category, stayMinutes, reason]
    StaticMapResult:
      type: object
      properties:
        provider:
          type: string
          enum: [KAKAO_JS_SDK_STATIC_MAP, KAKAO_MAP_SEARCH, NONE]
        staticMapConfig:
          type: object
          additionalProperties: true
        fallbackMapSearchUrl:
          type: string
        reason:
          type: string
      required: [provider]
    RecommendCourseData:
      type: object
      properties:
        status:
          type: string
          enum: [DONE, FAILED]
        resultType:
          type: string
          enum: [COURSE, UNKNOWN]
        mode:
          type: string
          enum: [LLM_OPENROUTER, RULE_BASED_FALLBACK]
        message:
          type: string
        selectedPlace:
          type: object
          additionalProperties: true
        conditions:
          type: object
          additionalProperties: true
        nearbyCandidateCount:
          type: integer
        courseTitle:
          type: string
        summary:
          type: string
        stops:
          type: array
          items:
            $ref: "#/components/schemas/CourseStop"
        staticMap:
          $ref: "#/components/schemas/StaticMapResult"
        llmPromptUsed:
          type: boolean
        failReason:
          type: [string, "null"]
        warnings:
          type: array
          items:
            type: string
      required: [status, resultType, mode, message, selectedPlace, conditions, nearbyCandidateCount, stops, staticMap, warnings]
    RecommendCourseSuccessResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/RecommendCourseData"
          required: [data]
    AnalyzeImageRequest:
      type: object
      properties:
        imageBase64:
          type: string
          minLength: 1
          description: Base64-encoded JPEG, PNG, or WebP image. Recommended max decoded size is 10MB.
        mimeType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        debug:
          type: boolean
          default: false
      required: [imageBase64, mimeType]
      additionalProperties: false
    AnalyzeImageData:
      type: object
      properties:
        primaryMood:
          type: string
        moodTags:
          type: array
          items:
            type: string
        matchedSceneTags:
          type: array
          items:
            type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        recommendedMoodId:
          type: string
        isEstimated:
          type: boolean
        warnings:
          type: array
          items:
            type: string
      required: [primaryMood, moodTags, matchedSceneTags, isEstimated]
    AnalyzeImageSuccessResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AnalyzeImageData"
          required: [data]
    PlaceData:
      type: object
      properties:
        place:
          $ref: "#/components/schemas/Place"
      required: [place]
    PlaceSuccessResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/PlaceData"
          required: [data]
