openapi: 3.1.0
info:
  title: Api
  version: 0.3.0
  description: Korean Travel Guide API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: moods
  - name: recommendations
  - name: images
  - name: places
  - name: kto
  - name: bookmarks
  - name: feedback
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /moods:
    get:
      operationId: getMoods
      tags: [moods]
      summary: Get the 7 GOAT primary mood themes
      responses:
        "200":
          description: Mood inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoodsSuccessResponse"
  /recommend-from-tags:
    post:
      operationId: recommendFromTags
      tags: [recommendations]
      summary: Recommend three places using the GOAT v1.3+ scoring engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecommendFromTagsRequest"
      responses:
        "200":
          description: Recommendations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationsSuccessResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many recommendation requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /recommend-course:
    post:
      operationId: recommendCourse
      tags: [recommendations]
      summary: Build a day course from one selected GOAT recommendation card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecommendCourseRequest"
      responses:
        "200":
          description: Day course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendCourseSuccessResponse"
        "400":
          description: Invalid request or selected place not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many recommendation requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /recommendations:
    post:
      operationId: createRecommendation
      tags: [recommendations]
      summary: Create and persist a recommendation for the authenticated user
      security: [{ sessionCookie: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecommendFromTagsRequest"
      responses:
        "201":
          description: Recommendation created
          content:
            application/json:
              schema:
                {
                  $ref: "#/components/schemas/RecommendationDataSuccessResponse",
                }
        "200":
          description: Existing idempotent result replayed
          content:
            application/json:
              schema:
                {
                  $ref: "#/components/schemas/RecommendationDataSuccessResponse",
                }
        "409":
          description: Idempotency conflict or request in progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /recommendations/recent:
    get:
      operationId: getRecentRecommendations
      tags: [recommendations]
      security: [{ sessionCookie: [] }]
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 20, default: 1 }
      responses:
        "200":
          description: Recent recommendations
          content:
            application/json:
              schema:
                {
                  $ref: "#/components/schemas/RecentRecommendationsSuccessResponse",
                }
  /recommendations/{recommendationId}:
    parameters:
      - in: path
        name: recommendationId
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getRecommendation
      tags: [recommendations]
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Saved recommendation
          content:
            application/json:
              schema:
                {
                  $ref: "#/components/schemas/RecommendationDataSuccessResponse",
                }
    delete:
      operationId: deleteRecommendation
      tags: [recommendations]
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Recommendation deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiSuccessBase" }
  /bookmarks:
    get:
      operationId: getBookmarks
      tags: [bookmarks]
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Bookmark list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookmarksSuccessResponse" }
    post:
      operationId: saveBookmark
      tags: [bookmarks]
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookmarkRequest" }
      responses:
        "200":
          description: Bookmark saved
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/BookmarkStatusSuccessResponse" }
  /bookmarks/{placeId}:
    delete:
      operationId: deleteBookmark
      tags: [bookmarks]
      security: [{ sessionCookie: [] }]
      parameters:
        - in: path
          name: placeId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Bookmark removed
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/BookmarkStatusSuccessResponse" }
  /bookmarks/{placeId}/status:
    get:
      operationId: getBookmarkStatus
      tags: [bookmarks]
      security: [{ sessionCookie: [] }]
      parameters:
        - in: path
          name: placeId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Bookmark status
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/BookmarkStatusSuccessResponse" }
  /recommendations/{recommendationId}/places/{placeId}/feedback:
    parameters:
      - in: path
        name: recommendationId
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: placeId
        required: true
        schema: { type: string }
    get:
      operationId: getRecommendationFeedback
      tags: [feedback]
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Feedback state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackSuccessResponse" }
    put:
      operationId: putRecommendationFeedback
      tags: [feedback]
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedbackRequest" }
      responses:
        "200":
          description: Feedback saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackSuccessResponse" }
    delete:
      operationId: deleteRecommendationFeedback
      tags: [feedback]
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Feedback cleared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackSuccessResponse" }
  /places/{id}:
    get:
      operationId: getPlace
      tags: [places]
      summary: Get a place by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Place details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceSuccessResponse"
        "404":
          description: Place not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /kto:
    get:
      operationId: proxyKto
      tags: [kto]
      summary: Proxy a Korea Tourism Organization API request
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: KTO path below https://apis.data.go.kr/B551011/
        - name: MobileOS
          in: query
          schema: { type: string, default: ETC }
        - name: MobileApp
          in: query
          schema: { type: string, default: GOAT }
        - name: _type
          in: query
          schema: { type: string, enum: [json] }
        - name: keyword
          in: query
          schema: { type: string }
        - name: contentId
          in: query
          schema: { type: string }
        - name: contentTypeId
          in: query
          schema: { type: string }
        - name: areaCode
          in: query
          schema: { type: string }
        - name: numOfRows
          in: query
          schema: { type: integer, minimum: 1 }
        - name: pageNo
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Raw KTO JSON response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Missing path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KtoProxyError"
        "403":
          description: KTO path is outside the server allowlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KtoProxyError"
        "500":
          description: Missing service key or upstream failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KtoProxyError"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: goat.sid
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    ApiSuccessBase:
      type: object
      properties:
        success:
          type: boolean
          const: true
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
      required: [success, code, message]
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          const: false
        code:
          type: string
        message:
          type: string
        data:
          nullable: true
        requestId:
          type: string
      required: [success, code, message, data]
    KtoProxyError:
      type: object
      properties:
        error:
          type: string
      required: [error]
    Mood:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        keywords:
          type: array
          items:
            type: string
      required: [id, name, description, keywords]
    MoodsData:
      type: object
      properties:
        moods:
          type: array
          items:
            $ref: "#/components/schemas/Mood"
      required: [moods]
    MoodsSuccessResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/MoodsData"
          required: [data]
    TravelPreferences:
      type: object
      properties:
        companion:
          type: string
          enum: [혼자, 연인, 친구, 가족]
        transport:
          type: string
          enum: [자차, 대중교통, 도보중심]
        visitTime:
          type: [string, "null"]
          enum: [새벽, 오전, 한낮, 오후, 일몰, 저녁, 야간, 밤/새벽, null]
        purpose:
          type: string
          enum: [가볍게 산책, 사진 위주, 액티비티, 조용한 휴식]
      required: [companion, transport, purpose]
      additionalProperties: false
    TravelOrigin:
      type: object
      properties:
        type:
          type: string
          enum: [current, region, skip]
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        regionName:
          type: string
          minLength: 1
      required: [type]
      additionalProperties: false
    RecommendFromTagsRequest:
      type: object
      properties:
        moodId:
          type: string
          minLength: 1
        referenceCardId:
          type: string
          minLength: 1
        travelPurpose:
          type: string
          enum:
            [
              사진·포토스팟,
              산책·힐링,
              카페·실내휴식,
              전시·건축관람,
              체험·액티비티,
              먹거리·야간탐방,
              숙소·리조트,
            ]
        transportType:
          type: string
          enum: [자차, 대중교통, 도보중심]
        visitTime:
          type: string
          enum: [새벽, 오전, 한낮, 오후, 저녁, 야간]
        currentMonth:
          type: integer
          minimum: 1
          maximum: 12
        debug:
          type: boolean
        preferences:
          $ref: "#/components/schemas/TravelPreferences"
        origin:
          $ref: "#/components/schemas/TravelOrigin"
        excludeIds:
          type: array
          uniqueItems: true
          maxItems: 58
          items:
            type: string
            minLength: 1
      additionalProperties: false
    RecommendCourseRequest:
      type: object
      properties:
        recommendationId:
          type: string
          format: uuid
        selectedPlaceId:
          type: string
          minLength: 1
        primaryTheme:
          type: string
          enum:
            [
              바다·해안 무드,
              일본 소도시·골목 무드,
              알프스·고원·목장 무드,
              숲·정원·자연휴식 무드,
              레트로·시장·항구 무드,
              건축·전시·랜드마크 무드,
              휴양·카페·이국공간 무드,
            ]
        userMoodTags:
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 1
        userSceneTags:
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 1
        companionType:
          type: string
          enum: [혼자, 친구, 연인, 가족]
        travelPurpose:
          type: string
          enum:
            [
              사진·포토스팟,
              산책·힐링,
              카페·실내휴식,
              전시·건축관람,
              체험·액티비티,
              먹거리·야간탐방,
              숙소·리조트,
            ]
        transportType:
          type: string
          enum: [자차, 대중교통, 도보중심]
        radiusMeters:
          type: integer
          minimum: 100
          maximum: 20000
        maxCandidatesForLlm:
          type: integer
          minimum: 1
          maximum: 20
        forceRuleBasedFallback:
          type: boolean
        llmModel:
          type: string
          minLength: 1
          maxLength: 120
        debug:
          type: boolean
      required: [selectedPlaceId, primaryTheme]
      additionalProperties: false
    Place:
      type: object
      properties:
        place_id: { type: string }
        city: { type: string }
        region_group: { type: string }
        place_name: { type: string }
        place_type: { type: string }
        primary_mood: { type: string }
        mood_tags:
          type: array
          items: { type: string }
        photo_point: { type: string }
        best_time: { type: string }
        best_season: { type: string }
        accessibility: { type: string }
        data_status:
          type: string
          enum: [confirmed, needs_verification, future_candidate]
        recommendation_use: { type: string }
        note: { type: string }
        address: { type: string }
        lat: { type: number }
        lng: { type: number }
        imageUrl: { type: string }
        parking: { type: string }
        travelTime: { type: string }
        weatherFit: { type: string }
        crowdLevel: { type: string }
        contactInfo: { type: string }
        description: { type: string }
      required:
        - place_id
        - city
        - region_group
        - place_name
        - place_type
        - primary_mood
        - mood_tags
        - photo_point
        - best_time
        - best_season
        - accessibility
        - data_status
        - recommendation_use
        - note
    RecommendationMatchDetail:
      type: object
      properties:
        requested:
          type: array
          items: { type: string }
        matched:
          type: array
          items: { type: string }
        count: { type: integer, minimum: 0 }
        score: { type: number, minimum: 0 }
      required: [requested, matched, count, score]
      additionalProperties: false
    RecommendationThemeScoreDetail:
      type: object
      properties:
        requested: { type: string }
        placeTheme: { type: string }
        matched: { type: boolean }
        score: { type: number, minimum: 0, maximum: 18 }
      required: [placeTheme, matched, score]
      additionalProperties: false
    RecommendationPurposeScoreDetail:
      type: object
      properties:
        requested: { type: string }
        placePurposeTags:
          type: array
          items: { type: string }
        matched: { type: boolean }
        score: { type: number, minimum: 0, maximum: 20 }
      required: [placePurposeTags, matched, score]
      additionalProperties: false
    RecommendationAccessibilityScoreDetail:
      type: object
      properties:
        transportType: { type: string }
        grade: { type: string }
        score: { type: number, minimum: 0, maximum: 12 }
        inferred: { type: boolean }
        note: { type: string }
      required: [score]
      additionalProperties: false
    RecommendationSeasonScoreDetail:
      type: object
      properties:
        requested: { type: string }
        placeSeasonTags:
          type: array
          items: { type: string }
        matchType:
          type: string
          enum: [current, all_season, none, not_requested]
        score: { type: number, minimum: 0, maximum: 13 }
      required: [placeSeasonTags, matchType, score]
      additionalProperties: false
    RecommendationScoreSummary:
      type: object
      description: User-safe summary. Internal exposure and candidate-selection adjustments are not exposed here.
      properties:
        moodScore: { type: integer, minimum: 0, maximum: 45 }
        conditionScore: { type: integer, minimum: 0, maximum: 45 }
        baseScore: { type: integer, minimum: 0, maximum: 90 }
        displayScore: { type: integer, minimum: 0, maximum: 100 }
      required: [moodScore, conditionScore, baseScore, displayScore]
      additionalProperties: false
    RecommendationScoreDetails:
      type: object
      properties:
        theme: { $ref: "#/components/schemas/RecommendationThemeScoreDetail" }
        moodTags: { $ref: "#/components/schemas/RecommendationMatchDetail" }
        sceneTags: { $ref: "#/components/schemas/RecommendationMatchDetail" }
        purpose: { $ref: "#/components/schemas/RecommendationPurposeScoreDetail" }
        accessibility: { $ref: "#/components/schemas/RecommendationAccessibilityScoreDetail" }
        season: { $ref: "#/components/schemas/RecommendationSeasonScoreDetail" }
      required: [theme, moodTags, sceneTags, purpose, accessibility, season]
      additionalProperties: false
    LegacyRecommendationScoreBreakdown:
      type: object
      properties:
        tag: { type: number }
        sceneSpecific: { type: number }
        region: { type: number }
        lodgingIntent: { type: number }
        season: { type: number }
        time: { type: number }
        weather: { type: number }
        companion: { type: number }
        travelPurpose: { type: number }
        transport: { type: number }
        dataStatus: { type: number }
        directMatchCount: { type: number }
        baseScore: { type: number }
        routeDistanceBonus: { type: number }
        duplicatePenalty: { type: number }
        selectionScore: { type: number }
        displayScore: { type: number }
      required:
        [
          tag,
          sceneSpecific,
          region,
          lodgingIntent,
          season,
          time,
          weather,
          companion,
          travelPurpose,
          transport,
          dataStatus,
          directMatchCount,
          baseScore,
          routeDistanceBonus,
          duplicatePenalty,
          selectionScore,
          displayScore,
        ]
      additionalProperties: false
    GoatMoodScoreBreakdown:
      type: object
      properties:
        total: { type: integer, minimum: 0, maximum: 45 }
        theme: { $ref: "#/components/schemas/RecommendationThemeScoreDetail" }
        moodTags: { $ref: "#/components/schemas/RecommendationMatchDetail" }
        sceneTags: { $ref: "#/components/schemas/RecommendationMatchDetail" }
        placeTypeHint:
          type: object
          properties:
            matchedHints:
              type: array
              items: { type: string }
            score: { type: number, minimum: 0, maximum: 3 }
            note: { type: string }
          required: [matchedHints, score, note]
          additionalProperties: false
      required: [total, theme, moodTags, sceneTags, placeTypeHint]
      additionalProperties: false
    GoatConditionScoreBreakdown:
      type: object
      properties:
        total: { type: integer, minimum: 0, maximum: 45 }
        purpose: { $ref: "#/components/schemas/RecommendationPurposeScoreDetail" }
        accessibility: { $ref: "#/components/schemas/RecommendationAccessibilityScoreDetail" }
        season: { $ref: "#/components/schemas/RecommendationSeasonScoreDetail" }
      required: [total, purpose, accessibility, season]
      additionalProperties: false
    GoatScoreBreakdown:
      type: object
      properties:
        moodScore: { $ref: "#/components/schemas/GoatMoodScoreBreakdown" }
        conditionScore: { $ref: "#/components/schemas/GoatConditionScoreBreakdown" }
        baseScore: { type: integer, minimum: 0, maximum: 90 }
        routeDistanceBonus: { type: integer, minimum: 0, maximum: 10 }
        duplicatePenalty: { type: integer, minimum: 0, maximum: 6 }
        exposurePenalty: { type: integer, minimum: 0, maximum: 5 }
        coverageBoost: { type: integer, minimum: 0, maximum: 3 }
        lowExposureBoost: { type: integer, minimum: 0, maximum: 3 }
        selectionScore: { type: integer, minimum: -11, maximum: 106 }
        displayScore: { type: integer, minimum: 0, maximum: 100 }
      required:
        [
          moodScore,
          conditionScore,
          baseScore,
          routeDistanceBonus,
          duplicatePenalty,
          exposurePenalty,
          coverageBoost,
          lowExposureBoost,
          selectionScore,
          displayScore,
        ]
      additionalProperties: false
    GoatRecommendationCard:
      type: object
      properties:
        rank: { type: integer, minimum: 1, maximum: 3 }
        role:
          type: string
          enum: [BEST_SCENE, SAME_MOOD_ALTERNATIVE, CONDITION_FIT_ALTERNATIVE]
        roleLabel: { type: string }
        placeId: { type: string }
        placeName: { type: string }
        city: { type: string }
        regionGroup: { type: string }
        primaryTheme: { type: string }
        placeType: { type: string }
        photoPoint: { type: string }
        recommendationUse: { type: string }
        bestTime: { type: string }
        seasonTags:
          type: array
          items: { type: string }
        purposeTags:
          type: array
          items: { type: string }
        accessibility:
          type: object
          properties:
            public_transport: { type: string }
            car: { type: string }
            walk: { type: string }
          additionalProperties: false
        note: { type: string }
        imageUrl: { type: [string, "null"] }
        address: { type: [string, "null"] }
        score: { $ref: "#/components/schemas/GoatScoreBreakdown" }
        reasons:
          type: array
          items: { type: string }
        cautions:
          type: array
          items: { type: string }
      required:
        [
          rank,
          role,
          roleLabel,
          placeId,
          placeName,
          city,
          regionGroup,
          primaryTheme,
          placeType,
          photoPoint,
          recommendationUse,
          bestTime,
          seasonTags,
          purposeTags,
          accessibility,
          score,
          reasons,
          cautions,
        ]
      additionalProperties: false
    Recommendation:
      type: object
      properties:
        place:
          $ref: "#/components/schemas/Place"
        role:
          type: string
          enum: [장면 최적, 같은 분위기 대안, 조건 맞춤]
        score:
