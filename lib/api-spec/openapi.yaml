openapi: 3.1.0
info:
  title: Api
  version: 0.3.0
  description: Korean Travel Guide API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: moods
  - name: recommendations
  - name: images
  - name: places
  - name: kto
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /moods:
    get:
      operationId: getMoods
      tags: [moods]
      summary: Get the 12 validated GOAT mood combinations
      responses:
        "200":
          description: Mood inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoodsSuccessResponse"
  /recommend-from-tags:
    post:
      operationId: recommendFromTags
      tags: [recommendations]
      summary: Recommend three places using the GOAT v1.3+ scoring engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecommendFromTagsRequest"
      responses:
        "200":
          description: Recommendations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationsSuccessResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many recommendation requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /analyze-image:
    post:
      operationId: analyzeImage
      tags: [images]
      summary: Analyze an uploaded travel photo and map it to GOAT mood tags
      description: >
        Accepts one image from an authenticated client. The server should derive
        the user id from the JWT/session if persisted data is needed; clients
        must not submit user_id in the request body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeImageRequest"
      responses:
        "200":
          description: Image mood analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzeImageSuccessResponse"
        "400":
          description: Invalid image payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required when saving analysis history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Image payload too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /places/{id}:
    get:
      operationId: getPlace
      tags: [places]
      summary: Get a place by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Place details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceSuccessResponse"
        "404":
          description: Place not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /kto:
    get:
      operationId: proxyKto
      tags: [kto]
      summary: Proxy a Korea Tourism Organization API request
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: KTO path below https://apis.data.go.kr/B551011/
        - name: MobileOS
          in: query
          schema: { type: string, default: ETC }
        - name: MobileApp
          in: query
          schema: { type: string, default: GOAT }
        - name: _type
          in: query
          schema: { type: string, enum: [json] }
        - name: keyword
          in: query
          schema: { type: string }
        - name: contentId
          in: query
          schema: { type: string }
        - name: contentTypeId
          in: query
          schema: { type: string }
        - name: areaCode
          in: query
          schema: { type: string }
        - name: numOfRows
          in: query
          schema: { type: integer, minimum: 1 }
        - name: pageNo
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Raw KTO JSON response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Missing path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KtoProxyError"
        "403":
          description: KTO path is outside the server allowlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KtoProxyError"
        "500":
          description: Missing service key or upstream failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KtoProxyError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    ApiSuccessBase:
      type: object
      properties:
        success:
          type: boolean
          const: true
        code:
          type: string
          const: SUCCESS
        message:
          type: string
      required: [success, code, message]
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          const: false
        code:
          type: string
        message:
          type: string
        data:
          nullable: true
      required: [success, code, message, data]
    KtoProxyError:
      type: object
      properties:
        error:
          type: string
      required: [error]
    Mood:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        keywords:
          type: array
          items:
            type: string
      required: [id, name, description, keywords]
    MoodsData:
      type: object
      properties:
        moods:
          type: array
          items:
            $ref: "#/components/schemas/Mood"
      required: [moods]
    MoodsSuccessResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/MoodsData"
          required: [data]
    TravelPreferences:
      type: object
      properties:
        companion:
          type: string
          enum: [혼자, 연인, 친구, 가족]
        transport:
          type: string
          enum: [자차, 대중교통, 도보중심]
        visitTime:
          type: [string, "null"]
          enum: [새벽, 오전, 한낮, 오후, 일몰, 저녁, 야간, 밤/새벽, null]
        purpose:
          type: string
          enum: [가볍게 산책, 사진 위주, 액티비티, 조용한 휴식]
      required: [companion, transport, purpose]
      additionalProperties: false
    TravelOrigin:
      type: object
      properties:
        type:
          type: string
          enum: [current, region, skip]
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        regionName:
          type: string
          minLength: 1
      required: [type]
      additionalProperties: false
    RecommendFromTagsRequest:
      type: object
      properties:
        moodId:
          type: string
          minLength: 1
        referenceCardId:
          type: string
          minLength: 1
        travelPurpose:
          type: string
          enum: [사진·포토스팟, 산책·힐링, 카페·실내휴식, 전시·건축관람, 체험·액티비티, 먹거리·야간탐방, 숙소·리조트]
        transportType:
          type: string
          enum: [자차, 대중교통, 도보중심]
        visitTime:
          type: string
          enum: [새벽, 오전, 한낮, 오후, 저녁, 야간]
        currentMonth:
          type: integer
          minimum: 1
          maximum: 12
        debug:
          type: boolean
        preferences:
          $ref: "#/components/schemas/TravelPreferences"
        origin:
          $ref: "#/components/schemas/TravelOrigin"
        excludeIds:
          type: array
          uniqueItems: true
          maxItems: 58
          items:
            type: string
            minLength: 1
      additionalProperties: false
    Place:
      type: object
      properties:
        place_id: { type: string }
        city: { type: string }
        region_group: { type: string }
        place_name: { type: string }
        place_type: { type: string }
        primary_mood: { type: string }
        mood_tags:
          type: array
          items: { type: string }
        photo_point: { type: string }
        best_time: { type: string }
        best_season: { type: string }
        accessibility: { type: string }
        data_status:
          type: string
          enum: [confirmed, needs_verification, future_candidate]
        recommendation_use: { type: string }
        note: { type: string }
        address: { type: string }
        lat: { type: number }
        lng: { type: number }
        imageUrl: { type: string }
        parking: { type: string }
        travelTime: { type: string }
        weatherFit: { type: string }
        crowdLevel: { type: string }
        contactInfo: { type: string }
        description: { type: string }
      required:
        - place_id
        - city
        - region_group
        - place_name
        - place_type
        - primary_mood
        - mood_tags
        - photo_point
        - best_time
        - best_season
        - accessibility
        - data_status
        - recommendation_use
        - note
    Recommendation:
      type: object
      properties:
        place:
          $ref: "#/components/schemas/Place"
        role:
          type: string
          enum: [장면 최적, 같은 분위기 대안, 조건 맞춤]
        score:
          type: number
        reason:
          type: string
        matchedTags:
          type: array
          items:
            type: string
        scoreBreakdown:
          type: object
          additionalProperties:
            type: number
        safetyNotes:
          type: array
          items:
            type: string
        weatherFit:
          type: string
        parkingInfo:
          type: string
      required:
        [place, role, score, reason, matchedTags, scoreBreakdown, safetyNotes, weatherFit, parkingInfo]
    RecommendationsData:
      type: object
      properties:
        moodId:
          type: string
        referenceCardId:
          type: string
        appliedTags:
          type: array
          items:
            type: string
        seedPoolSize:
          type: integer
          const: 58
        candidatePoolSize:
          type: integer
          minimum: 0
          maximum: 58
        poolPolicy:
          type: string
          enum: [ALL58, PRIMARY43]
        poolReason:
          type: string
        fallbackUsed:
          type: boolean
        adaptivePoolRetryUsed:
          type: boolean
        recommendations:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/Recommendation"
        cards:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: object
            additionalProperties: true
        alternatives:
          type: array
          items:
            type: object
            additionalProperties: true
        warnings:
          type: array
          items:
            type: string
      required:
        [moodId, appliedTags, seedPoolSize, candidatePoolSize, poolPolicy, poolReason, fallbackUsed, adaptivePoolRetryUsed, recommendations]
    RecommendationsSuccessResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/RecommendationsData"
          required: [data]
    AnalyzeImageRequest:
      type: object
      properties:
        imageBase64:
          type: string
          minLength: 1
          description: Base64-encoded JPEG, PNG, or WebP image. Recommended max decoded size is 10MB.
        mimeType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        debug:
          type: boolean
          default: false
      required: [imageBase64, mimeType]
      additionalProperties: false
    AnalyzeImageData:
      type: object
      properties:
        primaryMood:
          type: string
        moodTags:
          type: array
          items:
            type: string
        matchedSceneTags:
          type: array
          items:
            type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        recommendedMoodId:
          type: string
        isEstimated:
          type: boolean
        warnings:
          type: array
          items:
            type: string
      required: [primaryMood, moodTags, matchedSceneTags, isEstimated]
    AnalyzeImageSuccessResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AnalyzeImageData"
          required: [data]
    PlaceData:
      type: object
      properties:
        place:
          $ref: "#/components/schemas/Place"
      required: [place]
    PlaceSuccessResponse:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/PlaceData"
          required: [data]
